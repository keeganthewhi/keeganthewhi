<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="350" viewBox="0 0 1400 350" role="img" aria-labelledby="title desc">
<title id="title">An engineering perspective: boundaries, state, coordination, and evidence</title>
<desc id="desc">Four related concerns in systems architecture, with feedback from observation and verification.</desc>
